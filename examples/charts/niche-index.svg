<text x="28.0" y="768.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Of 31 niche pairs seen in two or more years, only these swap order: beauty, education, health, lifestyle, tech, travel. Ranking</text>
