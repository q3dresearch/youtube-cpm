<text x="28.0" y="533.5" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">Treat Shorts as a funnel into long-form. Don't treat it as income.</text>
<text x="28.0" y="552.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Long-form and Shorts share one ad pot and YouTube does not split it, so the shaded gap is the least that Shorts views have been</text>
