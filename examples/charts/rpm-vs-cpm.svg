<text x="28.0" y="563.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The channel's thumbnails kept pulling clicks inside YouTube's normal band, and its advertisers paid more per playback. What fell</text>
