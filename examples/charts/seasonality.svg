<text x="28.0" y="618.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Source: Alphabet Forms 10-Q, 10-K and 8-K earnings exhibits, row 'YouTube ads'. Rows in data/macro/macro.csv. Revenue is price times</text>
