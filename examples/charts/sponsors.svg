<text x="28.0" y="511.0" fill="none" stroke="#fcfcfb" stroke-width="3.4" stroke-linejoin="round" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">In the amber zone, take the sponsor. Right of it, turn one down when it hurts the video.</text>
<text x="28.0" y="511.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">In the amber zone, take the sponsor. Right of it, turn one down when it hurts the video.</text>
<text x="28.0" y="530.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Sponsor rates per view run 3–8x the niche's RPM, so one integration outweighs the ad income in every niche. That is why the</text>
<text x="28.0" y="543.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">sponsor zone is wide in low-RPM niches: gaming and entertainment depend on sponsors across most channel sizes. Q1 cuts ads by</text>
<text x="28.0" y="556.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">about 15%, which moves every right-hand edge 18% further right, so a channel near its green edge needs a sponsor in Q1 even if</text>
<text x="28.0" y="569.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">it doesn't the rest of the year.</text>
<line x1="28" y1="594.0" x2="852" y2="594.0" stroke="#e3e2db"/>
<text x="28.0" y="610.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">RPM, sponsor rate per 1,000 views and edit cost: maintainer_estimate rows in data/2026/benchmarks.csv. Creator marks: creator_report</text>
<text x="28.0" y="623.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">rows (cpv_brand) in data/&lt;year&gt;/creators.csv, each linked to the creator's own rate card.</text>
