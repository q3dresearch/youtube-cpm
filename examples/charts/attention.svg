<text x="28.0" y="517.5" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">Judge a video on day 7, and sell a sponsor on first-week views, not lifetime views.</text>
<text x="28.0" y="536.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">At the median half-life, 89% of a trending video's views arrive in its first week, so its AdSense is a one-week event. Breakeven</text>
<text x="28.0" y="549.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">has to be met in that week, and a flat sponsorship fee paid up front is worth more than it looks. Music is the exception (64% in</text>
<text x="28.0" y="562.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">week one): it keeps earning. The long tail comes from search, which this data cannot see; a tutorial that never trends is a</text>
<text x="28.0" y="575.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">different asset.</text>
<line x1="28" y1="600.0" x2="852" y2="600.0" stroke="#e3e2db"/>
<text x="28.0" y="616.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Source: Kaggle 'Trending YouTube Video Statistics' (datasnaek), CC0, US file, hash-pinned in examples/attention.py. Per-video fits in</text>
<text x="28.0" y="629.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">data/attention/halflife.csv. Categories with fewer than 30 fitted videos are left out.</text>
