<text x="28.0" y="861.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">examples/build_index.py). Dots: creator_report rows in &lt;year&gt;/creators.csv, each linked to the creator's own post.</text>
