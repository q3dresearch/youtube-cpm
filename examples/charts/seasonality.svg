<text x="28.0" y="519.5" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">Budget Q1 income at about 85% of Q4, in any market.</text>
<text x="28.0" y="538.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The dip does not shrink in a boom or deepen in a slump: 2021's Q1 grew 49% on the year and 2023's shrank, and both sit in the</text>
<text x="28.0" y="551.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">same band. So the dip is a calendar effect, not a market one. If the drop is price rather than volume, Q1 is when a brand's</text>
<text x="28.0" y="564.5" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">budget buys the most views, and when a creator has the least ad income to fall back on while negotiating.</text>
